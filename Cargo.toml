[package]
name = "visual-bitcoin-engine"
version = "0.1.0"
edition = "2024"
description = "An educational project to visualize how Bitcoin works"

# ============================================================
# [lib] — 라이브러리 + WASM(동적 라이브러리) 둘 다 생성
# ============================================================
# rlib   : main.rs(CLI 바이너리)가 엔진을 가져다 쓰기 위한 일반 Rust 라이브러리
# cdylib : 브라우저에서 실행할 WebAssembly(.wasm) 모듈을 만들기 위한 형식
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# SHA-256 해시를 만들어주는 라이브러리 (비트코인도 SHA-256을 사용한다)
sha2 = "0.10"
# 엔진 데이터를 JS(브라우저)로 넘길 때 JSON으로 직렬화하기 위한 라이브러리
serde = { version = "1", features = ["derive"] }
# secp256k1 타원곡선 ECDSA — 비트코인이 쓰는 바로 그 디지털 서명
k256 = { version = "0.13", features = ["ecdsa"] }
# 안전한 난수 (개인키 생성용). 브라우저에서는 아래 wasm 설정의 "js" 기능으로 동작.
getrandom = "0.2"

# ============================================================
# WASM(브라우저) 타겟에서만 필요한 의존성
# ============================================================
# 네이티브(CLI) 빌드에는 포함되지 않아 바이너리가 가벼워진다.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"   # Rust <-> JavaScript 다리
js-sys = "0.3"         # 브라우저의 Date.now() 등 JS 표준 객체 사용
serde_json = "1"       # 스냅샷을 JSON 문자열로 변환
# 브라우저에는 OS 난수가 없으므로, getrandom이 JS의 crypto.getRandomValues를 쓰게 한다.
getrandom = { version = "0.2", features = ["js"] }
