[package]
name = "visual-bitcoin-engine"
version = "0.1.0"
edition = "2024"
description = "An educational project to visualize how Bitcoin works"

[dependencies]
# SHA-256 해시를 만들어주는 라이브러리
# 비트코인도 SHA-256을 사용한다.
sha2 = "0.10"

# secp256k1 타원곡선 — 비트코인이 디지털 서명에 사용하는 곡선
# ECDSA(Elliptic Curve Digital Signature Algorithm) 구현 포함
k256 = { version = "0.13", features = ["ecdsa"] }

# 안전한 난수 생성 — 개인키를 만들 때 사용
rand = "0.8"
